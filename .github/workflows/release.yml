name: Release Update

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged commit
        uses: actions/checkout@v4

      - name: Set up JDK 20
        uses: actions/setup-java@v4
        with:
          java-version: 20
          distribution: temurin

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test client
        env:
          VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          export PATH=./tools:$PATH
          BUILD_DATE="$(date -u '+%b. %-d, %Y')"
          ./gradlew tests:cleanTest tools:pack tests:test desktop:dist \
            -PupdateUrl="$REPOSITORY" \
            -PassetUrl="$REPOSITORY" \
            -PassetRef="$VERSION" \
            -PclientVersion="$VERSION, $BUILD_DATE" \
            --parallel

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          cp desktop/build/libs/Mindustry.jar desktop.jar
          gh release create "$VERSION" desktop.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "Foo's Client $VERSION" \
            --generate-notes

      - name: Upload build on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: Desktop JAR (failed release build)
          path: desktop/build/libs/Mindustry.jar
          if-no-files-found: ignore
